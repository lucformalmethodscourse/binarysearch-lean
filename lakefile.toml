name = "binarysearch-lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["BinarySearch"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[lean_lib]]
name = "BinarySearch"
roots = ["Sorted", "BinarySearch", "BinarySearch.Examples", "SquareOfEven"]
